        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }

        .nav-bottom-fixed { margin-top: auto; padding: 12px 20px; border-top: 1px solid var(--nav-border); }
        .nav-footer { padding: 12px 20px; border-top: 1px solid #334155; color: #64748B; font-size: 11px; }
        .main-content { margin-left: var(--nav-width); height: 100vh; overflow-y: auto; background: #F8FAFC; }
        .page-head { padding: 20px 28px 0; }
        .page-head h1 { margin: 0 0 6px; color: #0F172A; font-size: 22px; font-weight: 700; }
        .page-head p { margin: 0 0 20px; color: #64748B; font-size: 13px; line-height: 1.8; }
        .deprecated-list { padding: 0 28px 40px; display: grid; gap: 14px; }
        .deprecated-card { background: white; border: 1px solid #E2E8F0; border-radius: 10px; padding: 16px; opacity: 0.85; }
