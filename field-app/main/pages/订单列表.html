<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单列表 · 移动端 App</title>
  <link href="../../../assets/css/font-awesome-local.css?v=8171babf" rel="stylesheet">
  <link href="../../../assets/css/variables.css?v=12f21725" rel="stylesheet">
  <link href="../../../assets/css/common.css?v=a6a1e0b1" rel="stylesheet">
  <link href="../../../assets/css/components.css?v=70397998" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #334155, #111827 65%); display: flex; align-items: center; justify-content: center; gap: 26px; padding: 28px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .phone { width: 393px; height: 852px; flex: none; background: #f8fafc; border-radius: 42px; border: 10px solid #0b1220; overflow: hidden; position: relative; box-shadow: 0 32px 80px rgba(2, 6, 23, .55); }
    .phone-status { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 12px; color: #0f172a; background: #fff; }
    .phone-topbar { height: 48px; display: flex; align-items: center; justify-content: center; background: #fff; border-bottom: 1px solid #eef2f7; font-size: 15px; font-weight: 700; color: #0f172a; }
    .phone-search { padding: 12px 16px 4px; background: #fff; }
    .phone-search input { width: 100%; box-sizing: border-box; height: 34px; border: 1px solid #eef2f7; background: #f1f5f9; border-radius: 999px; padding: 0 14px; font-size: 12px; color: #475569; }
    .order-list { padding: 10px 16px 28px; display: flex; flex-direction: column; gap: 10px; }
    .order-card { background: #fff; border: 1px solid #eef2f7; border-radius: 14px; padding: 13px 14px; }
    .order-card .order-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .order-card .order-no { font-size: 11px; color: #94a3b8; }
    .order-status { font-size: 11px; border-radius: 999px; padding: 2px 9px; }
    .st-running { background: #eff6ff; color: #1d4ed8; }
    .st-done { background: #ecfdf5; color: #047857; }
    .st-overdue { background: #fff7ed; color: #c2410c; }
    .order-card .order-name { font-size: 13.5px; color: #0f172a; font-weight: 600; margin-bottom: 4px; }
    .order-card .order-meta { font-size: 11.5px; color: #64748b; line-height: 1.7; }
    .control-rail { width: 300px; flex: none; align-self: stretch; background: rgba(15, 23, 42, .55); border: 1px solid rgba(148, 163, 184, .22); border-radius: 16px; padding: 18px; color: #cbd5e1; }
    .control-rail h2 { font-size: 14px; color: #f8fafc; margin: 0 0 8px; }
    .control-rail p { font-size: 12px; line-height: 1.8; color: #94a3b8; margin: 0 0 14px; }
    .dg-doc-btn { border: 1px solid rgba(125, 211, 252, .4); background: rgba(56, 189, 248, .12); color: #bae6fd; font-size: 12px; border-radius: 8px; padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .dg-doc-btn:hover { background: rgba(56, 189, 248, .22); }
    .control-rail .rail-note { margin-top: 16px; padding-top: 12px; border-top: 1px dashed rgba(148, 163, 184, .3); font-size: 11.5px; color: #7c8aa5; line-height: 1.8; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="phone-status"><span>09:41</span><span><i class="fas fa-signal" aria-hidden="true"></i> <i class="fas fa-wifi" aria-hidden="true"></i> <i class="fas fa-battery-three-quarters" aria-hidden="true"></i></span></div>
    <div class="phone-topbar">订单列表</div>
    <div class="phone-search"><input type="text" placeholder="搜索订单编号 / 物品名称" readonly></div>
    <div class="order-list">
      <div class="order-card">
        <div class="order-head"><span class="order-no">NO-2026-8801</span><span class="order-status st-running">配送中</span></div>
        <div class="order-name">文件袋 × 2</div>
        <div class="order-meta">一号站点 · 10:20 出发<br>收件人：示例用户 A</div>
      </div>
      <div class="order-card">
        <div class="order-head"><span class="order-no">NO-2026-8802</span><span class="order-status st-done">已签收</span></div>
        <div class="order-name">设备配件 × 1</div>
        <div class="order-meta">二号站点 · 09:05 送达<br>签收方式：扫码签收</div>
      </div>
      <div class="order-card">
        <div class="order-head"><span class="order-no">NO-2026-8803</span><span class="order-status st-overdue">超时未签收</span></div>
        <div class="order-name">办公用品 × 3</div>
        <div class="order-meta">三号站点 · 昨日 18:40 投柜<br>可发起退回操作</div>
      </div>
    </div>
  </div>

  <aside class="control-rail">
    <h2>设计稿控制区</h2>
    <p>该区域为设计稿控制区，用于放置需求文档入口与演示说明，不进入手机模型正文。</p>
    <button class="dg-doc-btn" type="button" onclick="DocPanel.toggle('app-order-list')">
      <i class="fas fa-book" aria-hidden="true"></i><span>需求文档</span>
    </button>
    <div class="rail-note">
      示例数据均为虚构；订单状态标签为静态展示，不代表真实业务状态流转。
    </div>
  </aside>

  <script src="../../../assets/js/doc-builder.js?v=02fad5e9"></script>
  <script src="../../../assets/js/components/doc-panel.js?v=bf6d429e"></script>
  <script>
    window.DocsData = {
      'app-order-list': {
        title: '订单列表（移动端 App）',
        requirement: {
          coreFlow: [
            '进入订单列表，默认加载全部进行中的订单',
            '顶部搜索框支持按订单编号或物品名称检索',
            '点击订单卡片进入订单详情（本期不含详情页）'
          ],
          fieldRows: [
            ['顶部', '搜索框', '默认提示文案「搜索订单编号 / 物品名称」，支持模糊匹配'],
            ['卡片', '订单编号', '等宽小字展示，前缀 NO-'],
            ['卡片', '状态标签', '配送中（蓝）/ 已签收（绿）/ 超时未签收（橙）'],
            ['卡片', '订单摘要', '物品名称 × 数量 + 站点 + 时间，最多两行']
          ],
          interactionRules: [
            '列表按创建时间倒序排列',
            '下拉刷新重新拉取第一页数据（静态原型不实现）'
          ],
          exceptionsBoundaries: [
            '无订单时展示空状态占位与「去下单」引导',
            '超时未签收订单允许在详情页发起退回，列表页仅展示状态'
          ]
        },
        css: {
          headers: ['选择器 / 元素', '规范说明'],
          rows: [
            ['.phone', '手机模型 393×852，圆角 42px，深色描边 10px'],
            ['.order-card', '白底卡片圆角 14px，13px 主字号，卡片间距 10px'],
            ['.order-status', '状态标签 999px 圆角 + 11px 字号，三色语义与 Web 端一致'],
            ['.control-rail', '右侧控制区宽 300px，半透明深色底，不进入手机模型正文']
          ]
        }
      }
    };

    DocPanel.autoShow('app-order-list');
  </script>
</body>
</html>
