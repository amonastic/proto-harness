<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>下单页 · 小程序</title>
  <link href="../../../assets/css/font-awesome.min.css?v=dfb8fc36" rel="stylesheet">
  <link href="../../../assets/css/font-awesome-local.css?v=8171babf" rel="stylesheet">
  <link href="../../../assets/css/variables.css?v=12f21725" rel="stylesheet">
  <link href="../../../assets/css/common.css?v=a6a1e0b1" rel="stylesheet">
  <link href="../../../assets/css/components.css?v=70397998" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #334155, #111827 65%); display: flex; align-items: center; justify-content: center; gap: 26px; padding: 28px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .phone { width: 375px; height: 812px; flex: none; background: #f8fafc; border-radius: 40px; border: 10px solid #0b1220; overflow: hidden; position: relative; display: flex; flex-direction: column; box-shadow: 0 32px 80px rgba(2, 6, 23, .55); }
    .phone-status { height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 12px; color: #0f172a; background: #fff; }
    .phone-topbar { height: 44px; display: flex; align-items: center; justify-content: center; background: #fff; border-bottom: 1px solid #eef2f7; font-size: 15px; font-weight: 700; color: #0f172a; }
    .form-area { flex: 1; overflow-y: auto; padding: 14px 16px 24px; }
    .form-card { background: #fff; border: 1px solid #eef2f7; border-radius: 14px; padding: 4px 14px; margin-bottom: 12px; }
    .form-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px solid #f1f5f9; }
    .form-row:last-child { border-bottom: 0; }
    .form-row label { font-size: 13px; color: #334155; flex: none; }
    .form-row .value { font-size: 13px; color: #94a3b8; text-align: right; }
    .form-row .value.filled { color: #0f172a; }
    .form-row i.chevron { color: #cbd5e1; font-size: 11px; margin-left: 6px; }
    .phone-bottom { padding: 12px 16px 22px; background: #fff; border-top: 1px solid #eef2f7; }
    .btn-submit { width: 100%; height: 44px; border: 0; border-radius: 999px; background: #0284c7; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    .control-rail { width: 300px; flex: none; align-self: stretch; background: rgba(15, 23, 42, .55); border: 1px solid rgba(148, 163, 184, .22); border-radius: 16px; padding: 18px; color: #cbd5e1; }
    .control-rail h2 { font-size: 14px; color: #f8fafc; margin: 0 0 8px; }
    .control-rail p { font-size: 12px; line-height: 1.8; color: #94a3b8; margin: 0 0 14px; }
    .dg-doc-btn { border: 1px solid rgba(125, 211, 252, .4); background: rgba(56, 189, 248, .12); color: #bae6fd; font-size: 12px; border-radius: 8px; padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .dg-doc-btn:hover { background: rgba(56, 189, 248, .22); }
    .control-rail .rail-note { margin-top: 16px; padding-top: 12px; border-top: 1px dashed rgba(148, 163, 184, .3); font-size: 11.5px; color: #7c8aa5; line-height: 1.8; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="phone-status"><span>09:41</span><span><i class="fas fa-signal" aria-hidden="true"></i> <i class="fas fa-wifi" aria-hidden="true"></i> <i class="fas fa-battery-three-quarters" aria-hidden="true"></i></span></div>
    <div class="phone-topbar">下单</div>
    <div class="form-area">
      <div class="form-card">
        <div class="form-row"><label>寄件地址</label><span class="value filled">一号站点 · A 区 <i class="fas fa-chevron-right chevron" aria-hidden="true"></i></span></div>
        <div class="form-row"><label>收件地址</label><span class="value">请选择收件地址 <i class="fas fa-chevron-right chevron" aria-hidden="true"></i></span></div>
      </div>
      <div class="form-card">
        <div class="form-row"><label>物品名称</label><span class="value">请输入物品名称</span></div>
        <div class="form-row"><label>物品数量</label><span class="value filled">1 件</span></div>
      </div>
      <div class="form-card">
        <div class="form-row"><label>期望送达</label><span class="value">请选择时间段 <i class="fas fa-chevron-right chevron" aria-hidden="true"></i></span></div>
        <div class="form-row"><label>备注</label><span class="value">选填</span></div>
      </div>
      <div class="form-card">
        <div class="form-row"><label>计价方式</label><span class="value filled">按站点标准计费</span></div>
      </div>
    </div>
    <div class="phone-bottom">
      <button class="btn-submit" type="button">提交订单</button>
    </div>
  </div>

  <aside class="control-rail">
    <h2>设计稿控制区</h2>
    <p>该区域为设计稿控制区，用于放置需求文档入口与演示说明，不进入小程序页面正文。</p>
    <button class="dg-doc-btn" type="button" onclick="DocPanel.toggle('miniapp-order-create')">
      <i class="fas fa-book" aria-hidden="true"></i><span>需求文档</span>
    </button>
    <div class="rail-note">
      示例数据均为虚构；表单控件为静态展示，不代表真实校验逻辑。
    </div>
  </aside>

  <script src="../../../assets/js/doc-builder.js?v=02fad5e9"></script>
  <script src="../js/docs.js?v=26c87324"></script>
  <script src="../../../assets/js/components/doc-panel.js?v=bf6d429e"></script>
  <script>

    DocPanel.autoShow('miniapp-order-create');
  </script>
</body>
</html>
