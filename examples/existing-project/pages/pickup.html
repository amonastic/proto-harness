<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>取件核销</title>
<style>
  body { margin: 0; background: #F4F5F7; color: #222; font-family: -apple-system, "PingFang SC", sans-serif; }
  header { background: #17324D; color: #fff; padding: 14px 20px; font-size: 14px; }
  main { max-width: 720px; margin: 28px auto; background: #fff; border: 1px solid #E2E6EA; border-radius: 12px; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  h2 { font-size: 15px; margin-top: 24px; }
  .code { background: #EEF6F2; color: #1F6F5C; border-radius: 8px; padding: 10px 12px; font-family: ui-monospace, Menlo, monospace; }
  .hint { color: #6B7280; font-size: 13px; }
  button { background: #1F6F5C; color: #fff; border: 0; border-radius: 8px; padding: 9px 14px; }
</style>
</head>
<body>
<header>社区驿站 · 作业端</header>
<main>
  <h1>取件核销</h1>
  <p class="hint">输入取件码后核对包裹与柜格信息，再执行开柜。</p>
  <h2>取件信息</h2>
  <p class="code">取件码：示例 6-2-0815</p>
  <p>包裹：示例包裹 · 柜格：A-02-03 · 状态：待取件</p>
  <h2>操作</h2>
  <p>每个取件码仅可开柜一次。操作结果会写入取件记录。</p>
  <button type="button">确认开柜</button>
</main>
</body>
</html>
